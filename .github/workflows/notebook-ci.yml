name: Notebook CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run-notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install jupyter nbconvert
      - name: Run all notebooks
        run: |
          for nb in *.ipynb; do
            jupyter nbconvert --to notebook --execute "$nb" --output-dir=/tmp/out
          done
